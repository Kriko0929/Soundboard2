```html
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6e8">

    <title>Óvoda – Pillangó csoport</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --szoveg: #344238;
            --arnyek: 0 8px 24px rgba(50, 65, 45, 0.12);
            --arnyek-hover: 0 14px 30px rgba(50, 65, 45, 0.19);
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
            background: #e9efdf;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Trebuchet MS", Arial, sans-serif;
            color: var(--szoveg);

            /* A háttér folyamatosan látható marad */
            background-color: #e9efdf;
            background-image: url("img/ovodahatter.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;

            overflow-x: hidden;
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 4px solid #405747;
            outline-offset: 4px;
        }

        /* TELJES OLDAL */

        .oldal {
            position: relative;
            isolation: isolate;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(16px, 3vw, 36px);
        }

        /* LÁGY, ÁTTETSZŐ FEHÉRES RÉTEG */

        .oldal::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background: rgba(255, 255, 255, 0.32);
        }

        /* FEJLÉC */

        .fejlec {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            animation: fejlecErkezes 0.65s ease-out both;
        }

        .vissza {
            flex-shrink: 0;
            border: none;
            border-radius: 16px;
            padding: 13px 20px;

            background: #ffffff;
            color: #405747;
            font-weight: bold;
            font-size: clamp(14px, 1.2vw, 17px);

            cursor: pointer;
            box-shadow: var(--arnyek);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .vissza:hover {
            background: #f0f7e9;
            transform: translateY(-2px);
        }

        .vissza:active {
            transform: scale(0.97);
        }

        .csoport {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: clamp(8px, 1.5vw, 16px);
            min-width: 0;
        }

        .csoport img {
            width: clamp(48px, 6vw, 82px);
            height: clamp(48px, 6vw, 82px);
            flex-shrink: 0;
            object-fit: contain;

            animation: pillangoErkezes 0.75s ease-out 0.12s both;
        }

        .csoport-szoveg {
            min-width: 0;
            text-align: right;
        }

        .csoport-szoveg h1 {
            font-size: clamp(19px, 2.5vw, 36px);
            line-height: 1.2;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }

        .csoport-szoveg p {
            font-size: clamp(12px, 1.2vw, 16px);
            opacity: 0.8;
        }

        /* BEVEZETŐ */

        .bevezeto {
            text-align: center;
            margin:
                clamp(30px, 5vh, 55px)
                auto
                clamp(24px, 4vh, 40px);
            padding: 0 10px;

            animation: bevezetoErkezes 0.65s ease-out 0.15s both;
        }

        .bevezeto h2 {
            font-size: clamp(27px, 3.5vw, 46px);
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .bevezeto p {
            font-size: clamp(15px, 1.6vw, 20px);
            line-height: 1.6;
        }

        /* HAT TEVÉKENYSÉGKÁRTYA */

        .menuk {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;

            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(14px, 2vw, 26px);
        }

        .kartya {
            width: 100%;
            min-width: 0;
            min-height: clamp(185px, 23vh, 250px);

            border: 3px solid rgba(255, 255, 255, 0.92);
            border-radius: clamp(20px, 2.2vw, 30px);
            padding: clamp(18px, 2.4vw, 30px)
                     clamp(12px, 1.8vw, 22px);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;

            color: var(--szoveg);
            cursor: pointer;
            box-shadow: var(--arnyek);

            -webkit-tap-highlight-color: transparent;

            /* A kártyák egymás után felugranak */
            opacity: 0;
            animation: kartyaFelugras 0.65s cubic-bezier(0.2, 0.8, 0.25, 1.12) both;

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease;
        }

        .kartya:nth-child(1) {
            animation-delay: 0.22s;
        }

        .kartya:nth-child(2) {
            animation-delay: 0.32s;
        }

        .kartya:nth-child(3) {
            animation-delay: 0.42s;
        }

        .kartya:nth-child(4) {
            animation-delay: 0.52s;
        }

        .kartya:nth-child(5) {
            animation-delay: 0.62s;
        }

        .kartya:nth-child(6) {
            animation-delay: 0.72s;
        }

        .kartya:hover {
            transform: translateY(-5px);
            box-shadow: var(--arnyek-hover);
        }

        .kartya:active {
            transform: scale(0.98);
        }

        .kartya .ikon {
            font-size: clamp(42px, 5vw, 64px);
            line-height: 1.2;
            margin-bottom: clamp(10px, 1.5vh, 16px);
        }

        .kartya h3 {
            font-size: clamp(18px, 1.8vw, 26px);
            line-height: 1.3;
            margin-bottom: 9px;
            overflow-wrap: anywhere;
        }

        .kartya p {
            max-width: 300px;
            font-size: clamp(13px, 1.2vw, 16px);
            line-height: 1.5;
        }

        .torna {
            background: #ffe1d6;
        }

        .enek {
            background: #fff0b8;
        }

        .kedvencek {
            background: #f5dff7;
        }

        .mese {
            background: #dceaff;
        }

        .jatekok {
            background: #d9f2dc;
        }

        .unnepek {
            background: #ffdfeb;
        }

        /* KIVÁLASZTOTT TEVÉKENYSÉG */

        .tartalom {
            display: none;
            width: 100%;
            max-width: 1100px;
            margin: clamp(25px, 5vh, 50px) auto 0;
            padding: clamp(24px, 5vw, 60px);

            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: clamp(22px, 3vw, 32px);

            background: rgba(255, 255, 255, 0.92);
            box-shadow: var(--arnyek);
            text-align: center;
        }

        .tartalom.lathato {
            display: block;
            animation: tartalomErkezes 0.35s ease both;
        }

        .tartalom-ikon {
            font-size: clamp(50px, 7vw, 80px);
            margin-bottom: 15px;
        }

        .tartalom h2 {
            font-size: clamp(26px, 3.5vw, 42px);
            line-height: 1.25;
            margin-bottom: 18px;
        }

        .tartalom p {
            font-size: clamp(15px, 1.6vw, 20px);
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .kesobbi {
            display: inline-block;
            max-width: 100%;
            margin-top: 25px;
            padding: 12px 20px;
            border-radius: 14px;
            background: #edf5e9;
            font-weight: bold;
            line-height: 1.5;
        }

        /* ANIMÁCIÓK */

        @keyframes fejlecErkezes {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pillangoErkezes {
            from {
                opacity: 0;
                transform: translateY(-10px) rotate(-8deg) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotate(0) scale(1);
            }
        }

        @keyframes bevezetoErkezes {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes kartyaFelugras {
            0% {
                opacity: 0;
                transform: translateY(36px) scale(0.92);
            }

            75% {
                opacity: 1;
                transform: translateY(-5px) scale(1.02);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes tartalomErkezes {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes menuVissza {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .menu-vissza-animacio {
            animation: menuVissza 0.35s ease both;
        }

        /* TABLET */

        @media (max-width: 900px) {
            .menuk {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px;
            }

            .kartya {
                min-height: 195px;
            }

            .bevezeto {
                margin-top: 35px;
            }
        }

        /* TELEFON */

        @media (max-width: 520px) {
            body {
                background-attachment: scroll;
            }

            .oldal {
                padding: 16px 14px 28px;
            }

            .fejlec {
                align-items: center;
                gap: 10px;
            }

            .vissza {
                max-width: 48%;
                padding: 11px 12px;
                border-radius: 13px;
                font-size: 13px;
                line-height: 1.4;
                white-space: normal;
            }

            .csoport {
                gap: 7px;
            }

            .csoport img {
                width: 45px;
                height: 45px;
            }

            .csoport-szoveg h1 {
                font-size: clamp(16px, 4.2vw, 20px);
                margin-bottom: 3px;
            }

            .csoport-szoveg p {
                font-size: 11px;
            }

            .bevezeto {
                margin: 30px auto 24px;
            }

            .bevezeto h2 {
                font-size: clamp(26px, 7vw, 32px);
                margin-bottom: 10px;
            }

            .bevezeto p {
                font-size: 15px;
            }

            .menuk {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .kartya {
                min-height: 165px;
                padding: 17px 9px;
                border-width: 2px;
                border-radius: 20px;
            }

            .kartya .ikon {
                font-size: clamp(36px, 10vw, 46px);
                margin-bottom: 9px;
            }

            .kartya h3 {
                font-size: clamp(16px, 4.3vw, 19px);
                margin-bottom: 6px;
            }

            .kartya p {
                font-size: 12px;
                line-height: 1.4;
            }

            .tartalom {
                margin-top: 25px;
                padding: 27px 17px;
                border-radius: 22px;
            }

            .tartalom-ikon {
                font-size: 56px;
            }

            .tartalom h2 {
                font-size: 27px;
            }

            .tartalom p {
                font-size: 15px;
                line-height: 1.7;
            }

            .kesobbi {
                margin-top: 20px;
                padding: 11px 13px;
                font-size: 13px;
            }
        }

        /* KÜLÖNÖSEN KESKENY TELEFON */

        @media (max-width: 360px) {
            .oldal {
                padding: 12px 10px 22px;
            }

            .fejlec {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .vissza {
                max-width: 100%;
            }

            .csoport {
                margin-left: auto;
            }

            .menuk {
                grid-template-columns: 1fr;
                gap: 13px;
            }

            .kartya {
                min-height: 150px;
                padding: 20px 14px;
            }

            .kartya .ikon {
                font-size: 42px;
            }

            .kartya h3 {
                font-size: 19px;
            }

            .kartya p {
                font-size: 14px;
            }
        }

        /* FEKVŐ TELEFON / ALACSONY KIJELZŐ */

        @media (max-height: 500px) and (min-width: 521px) {
            .oldal {
                padding-top: 14px;
                padding-bottom: 20px;
            }

            .bevezeto {
                margin-top: 20px;
                margin-bottom: 20px;
            }

            .kartya {
                min-height: 150px;
                padding: 16px;
            }

            .kartya .ikon {
                font-size: 38px;
                margin-bottom: 7px;
            }
        }

        /* CSÖKKENTETT MOZGÁS */

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .fejlec,
            .csoport img,
            .bevezeto,
            .kartya,
            .tartalom,
            .menu-vissza-animacio {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="oldal">

        <header class="fejlec">
            <button class="vissza" id="visszaGomb" type="button">
                ← Vissza a menühöz
            </button>

            <div class="csoport">
                <div class="csoport-szoveg">
                    <h1 id="csoportNev">Óvoda – Pillangó</h1>
                    <p>Tevékenységek és élmények</p>
                </div>

                <img
                    id="csoportJel"
                    src="img/pillangojel.png"
                    alt="Pillangó"
                >
            </div>
        </header>

        <section id="menuOldal">
            <div class="bevezeto">
                <h2>Mit csináljunk ma? 🌼</h2>
                <p>
                    Válassz egy tevékenységet, és indulhat a közös élmény!
                </p>
            </div>

            <div class="menuk">

                <button class="kartya torna"
                        data-kategoria="torna"
                        type="button">
                    <span class="ikon">🤸</span>
                    <h3>Torna</h3>
                    <p>Mozgás, ügyesség és vidám feladatok</p>
                </button>

                <button class="kartya enek"
                        data-kategoria="enek"
                        type="button">
                    <span class="ikon">🎵</span>
                    <h3>Ének-zene-tánc</h3>
                    <p>Dalok, ritmusok és táncos játékok</p>
                </button>

                <button class="kartya kedvencek"
                        data-kategoria="kedvencek"
                        type="button">
                    <span class="ikon">⭐</span>
                    <h3>Kedvencek</h3>
                    <p>A csoport kedvenc tevékenységei</p>
                </button>

                <button class="kartya mese"
                        data-kategoria="mese"
                        type="button">
                    <span class="ikon">📚</span>
                    <h3>Mese</h3>
                    <p>Mesék, történetek és képzelet</p>
                </button>

                <button class="kartya jatekok"
                        data-kategoria="jatekok"
                        type="button">
                    <span class="ikon">🧩</span>
                    <h3>Játékok</h3>
                    <p>Játékos feladatok és közös móka</p>
                </button>

                <button class="kartya unnepek"
                        data-kategoria="unnepek"
                        type="button">
                    <span class="ikon">🎉</span>
                    <h3>Jeles ünnepek</h3>
                    <p>Ünnepek, hagyományok és alkalmak</p>
                </button>

            </div>
        </section>

        <section
            class="tartalom"
            id="tartalomOldal"
            aria-live="polite"
        >
            <div class="tartalom-ikon" id="tartalomIkon">🌟</div>

            <h2 id="tartalomCim">Tevékenység</h2>

            <p id="tartalomLeiras">
                Itt jelennek majd meg a kiválasztott tevékenység tartalmai.
            </p>

            <span class="kesobbi">
                A tartalmakat később ide építjük be.
            </span>
        </section>

    </main>

    <script>
        "use strict";

        /* CSOPORT ADATAI */

        const aktualisCsoport = {
            nev: "Óvoda – Pillangó",
            kep: "img/pillangojel.png",
            alt: "Pillangó"
        };

        document.getElementById("csoportNev").textContent =
            aktualisCsoport.nev;

        document.getElementById("csoportJel").src =
            aktualisCsoport.kep;

        document.getElementById("csoportJel").alt =
            aktualisCsoport.alt;

        /* TEVÉKENYSÉGEK ADATAI */

        const kategoriak = {
            torna: {
                cim: "Torna",
                ikon: "🤸",
                leiras:
                    "Itt kapnak majd helyet a mozgásos feladatok, tornagyakorlatok és ügyességi játékok."
            },

            enek: {
                cim: "Ének-zene-tánc",
                ikon: "🎵",
                leiras:
                    "Itt lesznek majd a dalok, zenék, mondókák, ritmusjátékok és táncos tevékenységek."
            },

            kedvencek: {
                cim: "Kedvencek",
                ikon: "⭐",
                leiras:
                    "Ide kerülhetnek a csoport kedvenc hangjai, dalai, játékai és gyakran használt tevékenységei."
            },

            mese: {
                cim: "Mese",
                ikon: "📚",
                leiras:
                    "Itt gyűjthetjük össze a meséket, történeteket és a meséléshez kapcsolódó hangokat."
            },

            jatekok: {
                cim: "Játékok",
                ikon: "🧩",
                leiras:
                    "Ide kerülhetnek a közös játékok, játékos feladatok és az interaktív tevékenységek."
            },

            unnepek: {
                cim: "Jeles ünnepek",
                ikon: "🎉",
                leiras:
                    "Itt gyűjthetjük össze az ünnepekhez, évszakokhoz és hagyományokhoz kapcsolódó tartalmakat."
            }
        };

        const menuOldal = document.getElementById("menuOldal");
        const tartalomOldal = document.getElementById("tartalomOldal");
        const visszaGomb = document.getElementById("visszaGomb");

        let animacioFolyamatban = false;

        /* TEVÉKENYSÉG MEGNYITÁSA */

        document.querySelectorAll("[data-kategoria]").forEach(gomb => {
            gomb.addEventListener("click", () => {
                if (animacioFolyamatban) return;

                const adat = kategoriak[gomb.dataset.kategoria];

                if (!adat) return;

                document.getElementById("tartalomIkon").textContent =
                    adat.ikon;

                document.getElementById("tartalomCim").textContent =
                    adat.cim;

                document.getElementById("tartalomLeiras").textContent =
                    adat.leiras;

                menuOldal.style.display = "none";

                tartalomOldal.style.display = "block";
                tartalomOldal.classList.remove("lathato");

                void tartalomOldal.offsetWidth;

                tartalomOldal.classList.add("lathato");

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        });

        /* VISSZA GOMB */

        visszaGomb.addEventListener("click", () => {
            if (animacioFolyamatban) return;

            if (tartalomOldal.classList.contains("lathato")) {
                animacioFolyamatban = true;

                tartalomOldal.style.animation = "none";
                tartalomOldal.style.opacity = "1";

                void tartalomOldal.offsetWidth;

                tartalomOldal.style.transition = "opacity 0.25s ease";
                tartalomOldal.style.opacity = "0";

                window.setTimeout(() => {
                    tartalomOldal.classList.remove("lathato");
                    tartalomOldal.style.display = "none";
                    tartalomOldal.style.opacity = "";
                    tartalomOldal.style.transition = "";
                    tartalomOldal.style.animation = "";

                    menuOldal.style.display = "block";
                    menuOldal.classList.remove("menu-vissza-animacio");

                    void menuOldal.offsetWidth;

                    menuOldal.classList.add("menu-vissza-animacio");

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                    animacioFolyamatban = false;
                }, 250);

            } else {
                // A főoldal háttere nem halványul el.
                window.location.href = "fooldal.html";
            }
        });
    </script>
</body>
</html>
